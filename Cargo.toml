[workspace]
resolver = "2"
members = ["crates/rocr", "crates/rocr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure Rust OCR library powered by PaddlePaddle PP-OCRv6 models"

[workspace.dependencies]
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
clipper2-rust = "1.1.0"
image = "0.25.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
clap = { version = "4.6.5", features = ["derive"] }
anyhow = "1.0.104"
