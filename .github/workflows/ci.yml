name: CI

on:
  push:
  pull_request:

jobs:
  # Fast checks that need no model weights: format, lint, unit tests, build.
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

  # Full numeric verification against the official PaddlePaddle models. The
  # model weights are gitignored, so this job downloads the small-tier models
  # and ONNX exports, regenerates the reference fixtures, then runs every
  # oracle test.
  oracle:
    name: oracle (model verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System libraries for paddleocr
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python oracle tooling
        run: |
          python -m pip install --upgrade pip
          pip install onnxruntime onnx numpy pillow opencv-python-headless \
                      transformers safetensors huggingface_hub
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install paddleocr

      - name: Cache downloaded models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: dev-models
          key: dev-models-small-${{ hashFiles('scripts/ci-download-models.py') }}

      - name: Download small-tier models + ONNX oracles
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: python scripts/ci-download-models.py

      - name: Generate reference fixtures
        run: |
          python scripts/verify_onnx.py --tier small --rec --det
          python scripts/verify_paddle_det.py small
          python scripts/verify_textline_ori.py
          python scripts/verify_doc_ori.py
          python scripts/verify_uvdoc_onnx.py
          python scripts/verify_golden.py small

      - name: Run all tests with oracle fixtures
        run: cargo test --release --workspace
